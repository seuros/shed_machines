[package]
name = "shed-machines"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
authors = ["Abdelkader Boudih <oss@seuros.com>"]
license = "MIT"
description = "Adaptive concurrency limits and load shedding - AIMD, Vegas, CoDel and retry budgets, no_std with zero dependencies"
repository = "https://github.com/seuros/shed_machines"
keywords = ["load-shedding", "concurrency", "codel", "backpressure", "no-std"]
categories = ["no-std", "concurrency"]
readme = "README.md"
exclude = ["src/**/tests.rs"]

[lib]
name = "shed_machines"
crate-type = ["lib"]

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[lints]
workspace = true
